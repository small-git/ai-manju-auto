name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install deps
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest tests -q

      - name: validate story packs (no token needed)
        run: |
          python src/run_pipeline.py --story manhua_demo --validate-only
          python src/run_pipeline.py --story overtime_system --validate-only
          python src/run_pipeline.py --story shandong_1994 --validate-only
          python src/run_pipeline.py --story manhua_demo --expand-only
